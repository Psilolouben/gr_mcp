name: Hourly game check

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Debug env
        run: |
          echo "URL set: ${{ vars.UPSTASH_REDIS_REST_URL != '' }}"
          echo "TOKEN set: ${{ vars.UPSTASH_REDIS_REST_TOKEN != '' }}"
          echo "URL value: ${{ vars.UPSTASH_REDIS_REST_URL }}"

      - name: Run game check
        env:
          UPSTASH_REDIS_REST_URL:   ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ vars.UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN:       ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ vars.TELEGRAM_CHAT_ID }}
        run: node src/run-check.js
